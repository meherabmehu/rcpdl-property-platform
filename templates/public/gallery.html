{% extends "base.html" %}{% load static media_assets %}{% block content %}<section class="container gallery-page"><h1>{% if bn %}গ্যালারি{% else %}Gallery{% endif %}</h1><p class="lead">A closer look at our projects</p><div class="gallery-grid">{% for g in gallery %}<button class="photo" data-gallery="{{ forloop.counter0 }}"><img src="{{ g.image|media_url }}" alt="{{ g.caption }}" {% image_attributes g.image %} loading="lazy"><span>{{ g.caption }}<small>Illustrative image</small></span></button>{% endfor %}</div></section>{% endblock %}
