{% extends 'staff/base.html' %}{% block content %}<h1>FAQs</h1><p class="muted">Manage frequently asked questions on the public website.</p><section class="panel faq-list"><div class="staff-title"><h2>FAQ list</h2><button class="button" data-add-faq>＋ Add new FAQ</button></div>{% for question, answer in faqs %}<button class="faq-row {% if forloop.first %}selected{% endif %}" data-question="{{ question }}" data-answer="{{ answer }}">{{ question }}<span>›</span></button>{% endfor %}</section><form class="panel demo-editor faq-editor" data-draft-key="faqs"><div class="staff-title"><h2>Edit FAQ</h2><span class="badge draft draft-status">● Draft changes</span></div><div class="editor-tabs" role="tablist"><button type="button" role="tab" aria-selected="true" data-tab="en">English</button><button type="button" role="tab" aria-selected="false" data-tab="bn">বাংলা</button></div><div data-language="en"><div class="field"><label for="question">Question</label><input id="question" name="question_en" value="What information can I find?" required></div><div class="field"><label for="answer">Answer</label><textarea id="answer" name="answer_en" required>Explore project details or send an inquiry.</textarea></div></div><div data-language="bn" hidden><div class="field"><label for="question-bn">প্রশ্ন</label><input id="question-bn" name="question_bn" value="আমি কী তথ্য পেতে পারি?"></div><div class="field"><label for="answer-bn">উত্তর</label><textarea id="answer-bn" name="answer_bn">প্রকল্পের বিবরণ দেখুন বা আগ্রহ জানান।</textarea></div></div><div class="editor-actions"><button class="button" type="button" data-save-draft>Save draft</button><button class="button outline" type="button" data-preview>Preview</button><button class="button" type="submit">Review and publish</button></div></form>{% endblock %}
