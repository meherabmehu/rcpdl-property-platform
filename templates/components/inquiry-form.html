<form class="inquiry-form" action="{% url 'submit-inquiry' %}" method="post" novalidate>{% csrf_token %}
<div class="notice error form-error" role="alert" hidden></div>
<div class="name-phone"><div class="field"><label for="{{ form_id }}-name">{% if bn %}নাম (ঐচ্ছিক){% else %}Name (optional){% endif %}</label><input id="{{ form_id }}-name" name="name" maxlength="100" autocomplete="name" placeholder="{% if bn %}আপনার নাম লিখুন{% else %}Your name{% endif %}"></div>
<div class="field"><label for="{{ form_id }}-phone">{% if bn %}ফোন নম্বর *{% else %}Phone (required){% endif %}</label><input id="{{ form_id }}-phone" name="phone" type="tel" autocomplete="tel" required placeholder="{% if bn %}01XXX XXX123{% else %}Enter your phone number{% endif %}" aria-describedby="{{ form_id }}-phone-error"><small class="error-message" id="{{ form_id }}-phone-error"></small></div></div>
<div class="field"><label for="{{ form_id }}-project">{% if bn %}প্রকল্প *{% else %}Project (required){% endif %}</label><select id="{{ form_id }}-project" name="project" required><option value="">{% if bn %}প্রকল্প নির্বাচন করুন{% else %}Select a project{% endif %}</option>{% for p in projects %}<option value="{{ p.id }}" {% if screen != 'contact' and project.id == p.id %}selected{% endif %}>{% if bn %}{{ p.bn_name }}{% else %}{{ p.name }}{% endif %}</option>{% endfor %}</select></div>
<div class="field"><label for="{{ form_id }}-message">{% if bn %}বার্তা (ঐচ্ছিক){% else %}Message (optional){% endif %}</label><textarea id="{{ form_id }}-message" name="message" maxlength="2000" placeholder="{% if bn %}আপনার বার্তা লিখুন (ঐচ্ছিক){% else %}Add a short message...{% endif %}"></textarea></div>
<label class="check-label"><input type="checkbox" name="permission"><span>{% if bn %}এই অনুসন্ধান সম্পর্কে যোগাযোগের অনুমতি দিচ্ছি।{% else %}I agree to be contacted about this inquiry.{% endif %}<br><a href="{% url 'privacy' %}">{% if bn %}গোপনীয়তা নীতি{% else %}See our Privacy Policy.{% endif %}</a></span></label>
<div class="inquiry-actions"><button class="button" type="submit">{% if bn %}পাঠান{% else %}Send inquiry{% endif %}<span>→</span></button><button class="button outline edit-details" type="button" hidden>Edit details</button></div>
<p class="fine-print">ⓘ Contact details are not sent to the AI service.</p>
</form>
