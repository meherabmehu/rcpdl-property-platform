<div class="dialog-heading"><div class="bot-symbol" aria-hidden="true">♧</div><div><h2 id="{{ chat_id }}-title">AI project assistant</h2><p>🟢 Answers use published project information.</p></div></div><div class="chat-log" role="log" aria-live="polite"><div class="chat-bubble">{% if bn %}প্রকল্পের তথ্য জানতে সাহায্য করতে পারি।{% else %}How can I help you explore our projects?{% endif %}</div></div><form class="chat-form" action="{% url 'demo-assistant' %}" method="post">{% csrf_token %}<label class="sr-only" for="{{ chat_id }}-message">Ask about a project</label><input id="{{ chat_id }}-message"
       name="message"
       placeholder="Ask about a project..."
       required
       maxlength="2000"><button class="button">Send ◇</button></form><a class="chat-footer"
   href="{% url 'inquiry' %}?project={{ project.id }}">♧ Send an inquiry →</a>
